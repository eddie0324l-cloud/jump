<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方實名認證中心</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f2f2f7; margin: 0; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { text-align: center; max-width: 360px; width: 100%; background: white; padding: 24px 16px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); box-sizing: border-box; border-top: 6px solid #34c759; }
        h2 { margin: 0 0 6px; color: #1c1c1e; font-size: 19px; font-weight: 700; }
        p { font-size: 13.5px; color: #666; line-height: 1.4; text-align: center; margin: 0 0 18px; }
        
        .select-zone { display: flex; flex-direction: column; margin-top: 10px; }
        .site-btn { display: block; width: 100%; padding: 15px 12px; margin-bottom: 12px; color: white; text-decoration: none; border-radius: 14px; font-weight: bold; font-size: 15.5px; transition: transform 0.1s; border: none; cursor: pointer; box-sizing: border-box; text-align: center; }
        .site-btn:active { transform: scale(0.98); }
        
        .color-style-1 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); box-shadow: 0 4px 15px rgba(79, 172, 254, 0.25); }
        .color-style-2 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); box-shadow: 0 4px 15px rgba(118, 75, 162, 0.25); }
        .color-style-3 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); box-shadow: 0 4px 15px rgba(253, 160, 133, 0.25); }
    </style>
</head>
<body>

    <div class="container">
        <div style="font-size: 36px; margin-bottom: 6px;">🌍</div>
        <h2>請選擇欲前往的官方網站</h2>
        <p>您已通過安全環境驗證，請自行選擇任一站點進入：</p>
        
        <!-- 💡 在這裡修改你的官方網站目標網址 -->
        <div class="select-zone">
            <a id="btn-1" href="https://jsjjj.net/register.php" class="site-btn color-style-1">進入 急速金  官方網站</a>
            <a id="btn-2" href="https://ccans-loan.com/register.php" class="site-btn color-style-2">進入 鈔安心  官方網站</a>
            <a id="btn-3" href="https://dyhu.org/register.php" class="site-btn color-style-3">進入 貸好運  官方網站</a>
        </div>
    </div>

    <script type="text/javascript">
        // 依然保留 CSS 亂數洗牌功能，防止特定按鈕被點死
        var orders = [1, 2, 3];
        for (var i = orders.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = orders[i];
            orders[i] = orders[j];
            orders[j] = temp;
        }
        document.getElementById("btn-1").style.order = orders[0];
        document.getElementById("btn-2").style.order = orders[1];
        document.getElementById("btn-3").style.order = orders[2];
    </script>
</body>
</html>
