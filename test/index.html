<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前往註冊</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f2f2f7; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { text-align: center; max-width: 380px; width: 100%; background: white; padding: 30px 20px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); box-sizing: border-box; }
        .safari-icon { width: 60px; height: 60px; background: radial-gradient(circle, #56ccf2, #2f80ed); border-radius: 50%; position: relative; margin: 0 auto 15px; box-shadow: 0 4px 12px rgba(47, 128, 237, 0.3); }
        .safari-icon::after { content: ''; position: absolute; width: 0; height: 0; top: 50%; left: 50%; margin-top: -22px; margin-left: -5px; border-style: solid; border-width: 0 5px 22px 5px; border-color: transparent transparent #ff3b30 transparent; transform: rotate(45deg); transform-origin: 50% 100%; }
        .safari-pointer-bottom { position: absolute; width: 0; height: 0; top: 50%; left: 50%; margin-left: -5px; border-style: solid; border-width: 22px 5px 0 5px; border-color: #ffffff transparent transparent transparent; transform: rotate(45deg); transform-origin: 50% 0%; }
        h2 { margin: 0 0 10px; color: #1c1c1e; font-size: 20px; font-weight: 700; }
        p { font-size: 14px; color: #3a3a3c; line-height: 1.5; text-align: center; margin: 0 0 25px; }
        .copy-btn { display: block; width: 100%; padding: 14px; background-color: #007aff; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 16px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(0,123,255,0.2); }
        
        /* 複製成功的動態提示區 */
        #animation-zone { display: none; margin-top: 25px; animation: fadeIn 0.4s ease-out; }
        .toast-msg { color: #34c759; font-weight: bold; font-size: 16px; margin-bottom: 20px; }

        /* 圖文說明卡片 */
        .instruction-box { text-align: left; background: #f8f9fa; border-radius: 14px; padding: 14px 16px; margin-top: 12px; border: 1px solid #e5e5ea; }
        .step-badge { display: inline-block; background: #007aff; color: white; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 20px; margin-bottom: 6px; }
        .step-txt { font-size: 13.5px; color: #1c1c1e; line-height: 1.4; font-weight: 500; }
        .highlight-blue { color: #007aff; font-weight: bold; }

        /* ==================== 🎬 iOS 擬真操作動畫 ==================== */
        .mock-phone {
            width: 180px; height: 320px;
            border: 8px solid #1c1c1e; border-radius: 28px;
            margin: 0 auto 20px; position: relative;
            background: #000; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .mock-notch {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 70px; height: 12px; background: #1c1c1e;
            border-bottom-left-radius: 9px; border-bottom-right-radius: 9px; z-index: 10;
        }
        .mock-screen {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            position: relative; animation: screenSwitch 6s infinite ease-in-out;
        }
        .mock-safari-app {
            position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 42px; background: radial-gradient(circle, #56ccf2, #2f80ed);
            border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: appFade 6s infinite;
        }
        .mock-safari-app::after {
            content: 'Safari'; position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
            font-size: 9px; color: #fff; font-weight: normal;
        }
        .mock-browser-bar {
            position: absolute; top: 30px; left: 10px; right: 10px; height: 26px;
            background: rgba(255, 255, 255, 0.9); border-radius: 7px; opacity: 0;
            display: flex; align-items: center; padding-left: 8px; font-size: 9px;
            color: #8e8e93; box-sizing: border-box; animation: barFade 6s infinite;
        }
        .mock-finger {
            position: absolute; width: 22px; height: 22px;
            background: rgba(255, 255, 255, 0.4); border: 2px solid #fff; border-radius: 50%;
            top: 130px; left: 90px; transform: scale(0); z-index: 5;
            animation: fingerMovement 6s infinite ease-in-out;
        }

        /* ==================== 🔄 CSS 動態本體 ==================== */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes screenSwitch { 0%, 15% { background: linear-gradient(135deg, #1f1c2c, #928dab); } 25%, 85% { background: #f2f2f7; } 95%, 100% { background: linear-gradient(135deg, #1f1c2c, #928dab); } }
        @keyframes fingerMovement {
            0% { transform: scale(0); opacity: 0; top: 130px; left: 90px; }
            10% { transform: scale(1); opacity: 1; top: 130px; left: 90px; }
            14% { transform: scale(0.8); background: rgba(255,255,255,0.6); top: 130px; left: 90px; }
            18% { transform: scale(0); opacity: 0; top: 130px; left: 90px; }
            28% { transform: scale(0); opacity: 0; top: 43px; left: 90px; }
            35% { transform: scale(1); opacity: 1; top: 43px; left: 90px; }
            40% { transform: scale(0.8); background: rgba(255,255,255,0.6); top: 43px; left: 90px; }
            45%, 100% { transform: scale(0); opacity: 0; }
        }
        @keyframes appFade { 0%, 18% { opacity: 1; transform: translateX(-50%) scale(1); } 25%, 88% { opacity: 0; transform: translateX(-50%) scale(0.6); } 95%, 100% { opacity: 1; transform: translateX(-50%) scale(1); } }
        @keyframes barFade { 0%, 20% { opacity: 0; transform: translateY(-5px); } 25%, 42% { opacity: 1; transform: translateY(0); color: #8e8e93; } 48%, 85% { opacity: 1; transform: translateY(0); color: #007aff; } 92%, 100% { opacity: 0; transform: translateY(-5px); } }
        .mock-browser-bar::before { content: '搜尋或輸入網址'; animation: urlPaste 6s infinite; }
        @keyframes urlPaste { 0%, 42% { content: '搜尋或輸入網址'; } 50%, 85% { content: 'jsjjj.net/register.php'; } 92%, 100% { content: '搜尋或輸入網址'; } }
    </style>
</head>
<body>

    <!-- ==================== 【iOS 智慧引導區塊】 ==================== -->
    <div id="ios-zone" class="container" style="display: none; border-top: 6px solid #007aff;">
        <div class="safari-icon"><div class="safari-pointer-bottom"></div></div>
        <h2>請複製網址至 Safari 註冊</h2>
        <p>因 Facebook 系統限制，無法直接開啟。<br>請點擊下方按鈕，並依照動態步驟提示操作：</p>
        
        <button class="copy-btn" onclick="copyTargetUrl()">📋 點我複製註冊網址</button>

        <!-- 🎬 點擊複製後，動態淡入的「動畫+操作步驟」區 -->
        <div id="animation-zone">
            <div class="toast-msg">✓ 網址已複製成功！</div>
            
            <!-- 1. 擬真模擬動畫 -->
            <div class="mock-phone">
                <div class="mock-notch"></div><div class="mock-finger"></div>
                <div class="mock-screen"><div class="mock-safari-app"></div><div class="mock-browser-bar"></div></div>
            </div>

            <!-- 2. 同步文字步驟解說 -->
            <div class="instruction-box">
                <span class="step-badge" style="background-color: #8e8e93;">步驟 1</span>
                <div class="step-txt">按壓 Home 鍵或向上滑，先<b>退回手機桌面</b>。</div>
            </div>

            <div class="instruction-box">
                <span class="step-badge">步驟 2</span>
                <div class="step-txt">在桌面找到並打開藍色指南針 <span class="highlight-blue">🧭 Safari 瀏覽器</span>。</div>
            </div>

            <div class="instruction-box">
                <span class="step-badge">步驟 3</span>
                <div class="step-txt">點擊最上方或最下方的 <span class="highlight-blue">🔍 網址輸入列</span>，<b>長按並點選「貼上並前往」</b>即可進入網頁註冊。</div>
            </div>
        </div>
    </div>

    <!-- ==================== 【Android 自動跳轉區塊】 ==================== -->
    <div id="android-zone" class="container" style="display: none; border-top: 6px solid #34c759;">
        <div style="font-size: 45px; margin-bottom: 10px;">🔄</div>
        <h2>正在為您開啟註冊網頁...</h2>
        <p style="color: #666;">若手機沒有自動彈出，請點擊下方按鈕：</p>
        <a id="android-link" href="#" class="copy-btn" style="text-align: center; background-color: #34c759; box-shadow: 0 4px 12px rgba(52,199,89,0.2);">手動開啟預設瀏覽器</a>
    </div>

    <script type="text/javascript">
        var targetWebUrl = "jsjjj.net/register.php"; // 你的真正註冊網址
        var androidIntent = "intent://" + targetWebUrl + "#Intent;scheme=https;action=android.intent.action.VIEW;end";
        
        var ua = navigator.userAgent.toLowerCase();
        var isAndroid = ua.indexOf("android") > -1;

        if (isAndroid) {
            document.getElementById("android-zone").style.display = "block";
            document.getElementById("android-link").href = androidIntent;
            window.location.href = androidIntent;
        } else {
            document.getElementById("ios-zone").style.display = "block";
        }

        function copyTargetUrl() {
            var finalCopyUrl = "https://" + targetWebUrl;
            var tempInput = document.createElement("input");
            tempInput.value = finalCopyUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            
            try {
                document.execCommand("copy");
                document.getElementById("animation-zone").style.display = "block";
            } catch (err) {
                alert("複製失敗，請手動複製網址。");
            }
            document.body.removeChild(tempInput);
        }
    </script>
</body>
</html>
