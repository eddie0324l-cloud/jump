<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全台雲端媒合資訊站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">全台雲端媒合資訊站</div>
        <ul>
            <li><a href="index.html">首頁</a></li>
            <li><a href="#">關於我們</a></li>
            <li><a href="#">服務流程</a></li>
            <li><a href="#">立即申請</a></li>
        </ul>
    </nav>

    <div class="marquee-container">
        <div class="marquee" id="marquee-display">最新成交資訊載入中...</div>
    </div>

    <header class="hero">
        <h1>專業、安全、快速的資金媒合服務</h1>
        <p>全台各地服務，包含離島，協助您解決資金需求。</p>
    </header>

    <a href="https://lin.ee/SqO65x5" target="_blank" class="line-float">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" alt="Line">
    </a>

    <script>
        // 隨機跑馬燈邏輯
        const regions = ["台北市", "台中市", "高雄市", "台東縣", "澎湖縣", "金門縣"];
        const surnames = ["陳", "林", "黃", "張", "王"];
        const titles = ["先生", "小姐"];
        const products = ["房屋貸款", "信用貸款", "企業週轉"];
        const amounts = ["50萬", "120萬", "300萬"];

        function updateMarquee() {
            const data = `${regions[Math.floor(Math.random()*regions.length)]} ${surnames[Math.floor(Math.random()*surnames.length)]}${titles[Math.floor(Math.random()*titles.length)]} 成功申辦 ${products[Math.floor(Math.random()*products.length)]}，獲准額度 ${amounts[Math.floor(Math.random()*amounts.length)]}`;
            document.getElementById("marquee-display").innerText = "最新成交：" + data;
        }
        setInterval(updateMarquee, 3000);
        updateMarquee();
    </script>
</body>
</html>
