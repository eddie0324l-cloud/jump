<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全台雲端媒合資訊站 | 專業資金媒合顧問</title>
    <style>
        /* 全域樣式 */
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; margin: 0; line-height: 1.8; color: #444; background: #f8f9fa; }
        .container { max-width: 1100px; margin: auto; padding: 40px 20px; }
        
        /* Header 與 跑馬燈 */
        header { background: #fff; padding: 30px 0; text-align: center; border-bottom: 2px solid #2c3e50; }
        header h1 { color: #2c3e50; margin: 0; font-size: 28px; }
        
        .ticker-wrap { background: #e67e22; color: white; padding: 10px 0; overflow: hidden; white-space: nowrap; }
        #ticker { display: inline-block; padding-left: 100%; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* Banner 區域 */
        .hero { background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.8)), url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1600&q=80'); background-size: cover; background-position: center; color: white; padding: 80px 20px; text-align: center; }

        /* 信任區塊 */
        .trust-bar { display: flex; justify-content: space-around; background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .trust-item { flex: 1; border-right: 1px solid #3e5871; }
        .trust-item:last-child { border-right: none; }

        /* 案例卡片 */
        .case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; margin-top: 40px; }
        .case-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: 0.3s; }
        .case-img { width: 100%; height: 200px; object-fit: cover; }
        .case-content { padding: 25px; }

        /* 懸浮按鈕 */
        .fixed-contact { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .float-btn { display: block; width: 60px; height: 60px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-radius: 50%; overflow: hidden; background: white; transition: 0.3s; }
        .float-btn:hover { transform: scale(1.1); }
        
        footer { background: #1a1a1a; color: #888; text-align: center; padding: 40px; }
    </style>
</head>
<body>

<header>
    <h1>全台雲端媒合資訊站</h1>
</header>

<div class="ticker-wrap">
    <div id="ticker"></div>
</div>

<section class="hero">
    <h2 style="font-size: 36px; margin-bottom: 20px;">安全‧快速‧專業的資金媒合</h2>
    <p style="font-size: 18px; opacity: 0.9;">深耕台灣在地資源，為您提供最即時的資金媒合方案。</p>
</section>

    <div class="trust-item"><h3>全程保密</h3><p>嚴格保護個人隱私</p></div>
    <div class="trust-item"><h3>在地服務</h3><p>全台資源精準對接</p></div>
</div>

<div class="container">
    <section>
        <h2 style="text-align:center; color:#2c3e50;">成功媒合案例</h2>
        <div class="case-grid">
            <div class="case-card">
                <img src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=600&q=80" alt="案例1" class="case-img">
                <div class="case-content">
                    <h3>【台中】製造業設備升級資金</h3>
                    <p>協助企業在 48 小時內媒合到合適的資金資源，確保生產線順利運作。</p>
                </div>
            </div>
            <div class="case-card">
                <img src="https://images.unsplash.com/photo-1560520653-9e004c8926a7?auto=format&fit=crop&w=600&q=80" alt="案例2" class="case-img">
                <div class="case-content">
                    <h3>【台北】個人急難週轉解決</h3>
                    <p>針對突發資金需求，提供合規的在地金融資源對接，解決客戶燃眉之急。</p>
                </div>
            </div>
            <div class="case-card">
                <img src="https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=600&q=80" alt="案例3" class="case-img">
                <div class="case-content">
                    <h3>【高雄】小微企業創業營運金</h3>

                </div>
            </div>
        </div>
    </section>
</div>

<div class="fixed-contact">
    <a href="https://lin.ee/zyXjA5K" target="_blank" class="float-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" width="60"></a>
    <a href="https://www.facebook.com/profile.php?id=61590891923053" target="_blank" class="float-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" width="60"></a>
</div>

<footer>
    <p>全台雲端媒合資訊站 © 2026. All Rights Reserved.</p>
</footer>

<script>
    const cases = ["台北市 張先生 成功媒合營運資金", "新北市 陳小姐 順利對接創業貸款", "台中市 林先生 圓滿解決資金周轉", "台南市 吳先生 成功取得設備更新資金", "高雄市 黃小姐 順利媒合個人週轉需求", "桃園市 李先生 成功對接經營資源"];
    const ticker = document.getElementById('ticker');
    const shuffled = cases.sort(() => 0.5 - Math.random());
    ticker.innerHTML = shuffled.map(item => `📢 ${item} &nbsp;&nbsp;&nbsp;&nbsp;`).join(' ');
</script>

</body>
</html>
