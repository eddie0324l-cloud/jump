<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>資金媒合專業諮詢</title>
    <style>
        :root {
            /* 調整為明亮且具質感的色彩學配置 */
            --primary-blue: #0056b3;   /* 深專業藍，取代黑，更有質感 */
            --light-blue: #eef6ff;     /* 極淺藍底，取代死白，降低視覺疲勞 */
            --accent-orange: #f39c12;  /* 活力橘，用於重點按鈕與圖示 */
            --text-dark: #2c3e50;      /* 柔和深灰色文字，閱讀更舒適 */
        }

        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: var(--text-dark); background: #ffffff; margin: 0; line-height: 1.6; }

        /* 導航：以專業藍為基底，明亮通透 */
        nav { background: #ffffff; padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--light-blue); }

        /* Hero：明亮漸層，給人希望感 */
        .hero { padding: 80px 8%; text-align: center; background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 100%); }
        .hero h2 { color: var(--primary-blue); font-size: 44px; margin-bottom: 15px; }

        /* 跑馬燈：用專業藍底+白色文字，清晰穩定 */
        .ticker-wrap { background: var(--primary-blue); color: #fff; padding: 12px 0; overflow: hidden; white-space: nowrap; }
        
        /* 區塊顏色：使用淺藍底色帶出專業感 */
        .section-bg { background: var(--light-blue); padding: 60px 8%; }
        
        /* 卡片設計：強調邊框陰影，營造立體明亮感 */
        .card { padding: 30px; background: #fff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* 按鈕：保持活力橘，作為唯一的視覺跳色點，提升點擊率 */
        .line-btn { position: fixed; bottom: 30px; right: 30px; background: var(--accent-orange); color: white; padding: 18px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 6px 15px rgba(243, 156, 18, 0.4); }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 22px; font-weight: bold; color: var(--primary-blue);">專業資金媒合</div>
</nav>

<section class="hero">
    <h2>為您的企業，對接最合適的金融資源</h2>
    <p>透過專業、透明的顧問服務，精準解決您的營運資金需求。</p>
</section>

<div class="ticker-wrap"><div id="ticker"></div></div>

<section class="section-bg">
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
        <div class="card"><h3>🛡️ 風險控管</h3><p>以專業眼光把關每一份合約，確保企業資金安全。</p></div>
        <div class="card"><h3>⚡ 快速對接</h3><p>打破銀行審核的時間壁壘，效率是我們的核心價值。</p></div>
        <div class="card"><h3>⚖️ 公開透明</h3><p>無隱形成本，流程公開，讓您全程掌握媒合進度。</p></div>
    </div>
</section>

<!-- ...其餘內容結構維持，但在配色上使用上述 CSS 變數控制 -->

<a href="https://line.me/ti/p/9G5Oxcx" class="line-btn" target="_blank">💬 立即諮詢資金規劃</a>

<script>
    // 跑馬燈內容保持...
    const ticker = document.getElementById('ticker');
    ticker.innerHTML = "📢 即時媒合資訊：全台企業週轉金對接中... ".repeat(10);
</script>
</body>
</html>
