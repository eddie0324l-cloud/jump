<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方服務入口 | 申辦中心</title>
    <style>
        :root { --primary-color: #0056b3; --bg-color: #f8f9fa; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* 官方風格導航 */
        header { background: white; padding: 20px; border-bottom: 3px solid var(--primary-color); text-align: center; font-weight: bold; font-size: 18px; color: #333; }
        
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { text-align: center; max-width: 400px; width: 100%; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e9ecef; }
        
        h2 { color: #212529; margin-bottom: 15px; }
        .hint-text { color: #6c757d; font-size: 15px; margin-bottom: 30px; line-height: 1.6; }
        
        .site-btn { display: block; width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #dee2e6; color: #495057; text-decoration: none; border-radius: 4px; font-weight: 600; text-align: center; transition: all 0.2s; }
        .site-btn:hover { background: #f1f3f5; border-color: #adb5bd; }
        
        footer { padding: 20px; text-align: center; color: #adb5bd; font-size: 12px; }
    </style>
</head>
<body>

    <header>官方申辦服務中心</header>

    <main>
        <div class="container">
            <div style="font-size: 40px; margin-bottom: 10px;">🏢</div>
            <h2>服務申辦導引</h2>
            <p id="hint-text" class="hint-text"></p>
            
            <div id="select-zone">
                <a href="https://lin.ee/SQJxNtp" class="site-btn">急速金 官方Line</a>
                <a href="https://lin.ee/pjknVQF" class="site-btn">鈔安心 官方Line</a>
                <a href="https://lin.ee/zRInWfe" class="site-btn">貸好運 官方Line</a>
            </div>
        </div>
    </main>

    <footer>© 2026 官方服務中心。此頁面為受權正式申辦管道。</footer>

    <script type="text/javascript">
        // 隨機提示詞
        var hints = [
            "請點擊任一個您喜歡的商家，系統將立即引導您前往申辦流程。",
            "建議您挑選喜愛的商家，點擊後即可快速前往線上申辦服務。",
            "請選擇任一商家點擊進入，我們將為您開啟專屬的官方申請通道。"
        ];
        document.getElementById("hint-text").innerText = hints[Math.floor(Math.random() * hints.length)];

        // 隨機按鈕排序
        var parent = document.getElementById("select-zone");
        var buttons = Array.from(parent.children);
        buttons.sort(() => 0.5 - Math.random());
        buttons.forEach(btn => parent.appendChild(btn));
    </script>
</body>
</html>
