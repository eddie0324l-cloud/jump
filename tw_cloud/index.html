<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方服務入口</title>
    <style>
        body { margin: 0; background: #050505; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        /* 金幣雨背景 */
        .gold-rain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .coin { position: absolute; color: #ffd700; font-size: 20px; animation: fall linear infinite; opacity: 0.4; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* 泡泡風格 */
        .bubble { 
            position: absolute; width: 150px; height: 150px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-weight: bold; text-decoration: none;
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: transform 0.2s; z-index: 1; cursor: pointer;
        }
        .bubble:hover { transform: scale(1.1); }
        .b1 { background: rgba(79, 172, 254, 0.3); }
        .b2 { background: rgba(118, 75, 162, 0.3); }
        .b3 { background: rgba(253, 160, 133, 0.3); }
    </style>
</head>
<body>

    <div id="rain" class="gold-rain"></div>

    <a href="https://lin.ee/SQJxNtp" class="bubble b1" id="bub1">急速金</a>
    <a href="https://lin.ee/pjknVQF" class="bubble b2" id="bub2">鈔安心</a>
    <a href="https://lin.ee/zRInWfe" class="bubble b3" id="bub3">貸好運</a>

    <script>
        // 金幣雨
        const rain = document.getElementById('rain');
        for(let i=0; i<15; i++) {
            const c = document.createElement('div');
            c.innerHTML = '💰'; c.className = 'coin';
            c.style.left = Math.random()*100 + '%';
            c.style.animationDuration = (Math.random()*3+2) + 's';
            c.style.animationDelay = Math.random()*5 + 's';
            rain.appendChild(c);
        }

        // 螢幕保護程式碰撞邏輯
        const bubbles = [document.getElementById('bub1'), document.getElementById('bub2'), document.getElementById('bub3')];
        let pos = bubbles.map(() => ({ 
            x: Math.random() * (window.innerWidth - 150), 
            y: Math.random() * (window.innerHeight - 150),
            vx: (Math.random() - 0.5) * 4, 
            vy: (Math.random() - 0.5) * 4 
        }));

        function animate() {
            bubbles.forEach((b, i) => {
                pos[i].x += pos[i].vx;
                pos[i].y += pos[i].vy;

                if (pos[i].x <= 0 || pos[i].x >= window.innerWidth - 150) pos[i].vx *= -1;
                if (pos[i].y <= 0 || pos[i].y >= window.innerHeight - 150) pos[i].vy *= -1;

                b.style.left = pos[i].x + 'px';
                b.style.top = pos[i].y + 'px';
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
