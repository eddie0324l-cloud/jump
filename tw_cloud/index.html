<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服務入口</title>
    <style>
        body { margin: 0; padding: 0; background: #0f172a; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        
        .bubble-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; }

        .bubble { 
            width: 220px; height: 220px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold; text-decoration: none; text-align: center; padding: 20px;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 0 20px rgba(255,255,255,0.1);
            transition: transform 0.3s ease; animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .b1 { background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe); }
        .b2 { background: radial-gradient(circle at 30% 30%, #667eea, #764ba2); }
        .b3 { background: radial-gradient(circle at 30% 30%, #f6d365, #fda085); }
    </style>
</head>
<body>

    <div id="container" class="bubble-container">
        <a href="https://lin.ee/SQJxNtp" class="bubble b1">急速金<br>官方Line</a>
        <a href="https://lin.ee/pjknVQF" class="bubble b2">鈔安心<br>官方Line</a>
        <a href="https://lin.ee/zRInWfe" class="bubble b3">貸好運<br>官方Line</a>
    </div>

    <script>
        // 1. 隨機排序
        const container = document.getElementById("container");
        const bubbles = Array.from(container.children);
        bubbles.sort(() => 0.5 - Math.random());
        bubbles.forEach(b => container.appendChild(b));

        // 2. 手機晃動效果 (監聽陀螺儀)
        window.addEventListener("deviceorientation", (event) => {
            const x = event.gamma; // 左右傾斜
            const y = event.beta;  // 前後傾斜
            container.style.transform = `translate(${x * 0.5}px, ${y * 0.5}px)`;
        });
    </script>
</body>
</html>
